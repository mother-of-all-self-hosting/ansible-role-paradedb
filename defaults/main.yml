---
# Project source code URL: https://github.com/paradedb/paradedb

paradedb_enabled: true

# paradedb_identifier controls the identifier of this ParadeDB instance, which influences:
# - the default storage path
# - the names of systemd services
# - the names of various helper scripts
# - the names of temporary files
paradedb_identifier: 'paradedb'

paradedb_base_path: "/{{ paradedb_identifier }}"
paradedb_data_path: "{{ paradedb_base_path }}/data"
# The host path where the ParadeDB unix socket directory is mounted (when enabled).
paradedb_run_path: "{{ paradedb_base_path }}/run"
# The path where the data directory is bind-mounted to inside the container.
# Previously, we used `/var/lib/postgresql/data` for this, but ParadeDB v18+ made `/var/lib/postgresql` a VOLUME,
# so we can't bind-mount a directory beneath it. It's better to use something completely different (like `/data`) instead.
# Related to: `paradedb_server_environment_variable_pgdata`
paradedb_data_in_container_path: "/data"
paradedb_bin_path: "{{ paradedb_base_path }}/bin"

# renovate: datasource=docker depName=paradedb/paradedb versioning=semver
paradedb_version: v0.26.7

paradedb_uid: ""
paradedb_gid: ""

paradedb_connection_hostname: "{{ paradedb_identifier }}"
paradedb_connection_port: 5432
paradedb_connection_username: "root"
paradedb_connection_password: ""
paradedb_db_name: "main"

paradedb_default_lc_collate: C
paradedb_default_lc_type: C
paradedb_default_encoding: UTF8

# pgtune.leopard.in.ua implementation in ansible, based on https://github.com/le0pard/pgtune/blob/master/src/features/configuration/configurationSlice.js
# The following block calculates optimal defaults, based on server's CPU and RAM, all calculations are in kb
paradedb_memtotal_kb: "{{ ansible_facts['memtotal_mb']*1024|int }}"
paradedb_data_storage: ssd # possible values: ssd, hdd
paradedb_max_connections: 200
paradedb_shared_buffers: "{{ paradedb_memtotal_kb|int/4 }}"
paradedb_effective_cache_size: "{{ (paradedb_memtotal_kb|int*3)/4 }}"
paradedb_maintenance_work_mem: "{{ 2097152 if (paradedb_memtotal_kb|int/16)/1024 >= 2048 else paradedb_memtotal_kb|int/16 }}"
paradedb_checkpoint_completion_target: 0.9
paradedb_wal_buffers: "{{ 16384 if ((paradedb_shared_buffers|int*3)/100)/1024 >= 16 else paradedb_shared_buffers|int }}" # 16mb
paradedb_min_wal_size: 1048576 # 1gb
paradedb_max_wal_size: 4194304 # 4gb
paradedb_default_statistics_target: 100
paradedb_random_page_cost: "{{ 1.1 if paradedb_data_storage == 'ssd' else 4 }}"
paradedb_effective_io_concurrency: "{{ 200 if paradedb_data_storage == 'ssd' else 2 }}"
paradedb_max_worker_processes: "{{ ansible_facts['processor_nproc'] }}"
paradedb_max_parallel_workers: "{{ ansible_facts['processor_nproc'] }}"
paradedb_max_parallel_workers_per_gather: "{{ (4 if ansible_facts['processor_nproc']/2 > 4 else ansible_facts['processor_nproc']|int/2) | round(0, 'ceil') | int }}"
paradedb_max_parallel_maintenance_workers: "{{ (4 if ansible_facts['processor_nproc']/2 > 4 else ansible_facts['processor_nproc']|int/2) | round(0, 'ceil') | int }}"
paradedb_work_mem_raw: "{{ ((paradedb_memtotal_kb|int - paradedb_shared_buffers|int)/(paradedb_max_connections|int*3))/paradedb_max_parallel_workers_per_gather|int }}"
paradedb_work_mem: "{{ 64 if paradedb_work_mem_raw|int <= 64 else paradedb_work_mem_raw|int }}"
paradedb_huge_pages: "{{ 'off' if paradedb_memtotal_kb|int/1024/1024 < 32 else 'try' }}"

# Poll interval (seconds) while waiting for vacuum async job completion
paradedb_vacuum_poll_interval: 2

# paradedb_initdb_args controls POSTGRES_INITDB_ARGS
paradedb_initdb_args: "{{ paradedb_initdb_args_list | join(' ') }}"

paradedb_initdb_args_list: "{{ paradedb_initdb_args_list_default + paradedb_initdb_args_list_auto + paradedb_initdb_args_list_custom }}"
paradedb_initdb_args_list_default:
  - "--lc-collate {{ paradedb_default_lc_collate }}"
  - "--lc-ctype {{ paradedb_default_lc_type }}"
  - "--encoding {{ paradedb_default_encoding }}"
paradedb_initdb_args_list_auto: []
paradedb_initdb_args_list_custom: []

# paradedb_systemd_services_to_stop_for_maintenance_list specifies the list of systemd services to stop before upgrading or vacuuming (for certain vacuum operations).
# These services will be restarted after the operation completes.
paradedb_systemd_services_to_stop_for_maintenance_list: "{{ paradedb_systemd_services_to_stop_for_maintenance_list_auto + paradedb_systemd_services_to_stop_for_maintenance_list_custom }}"
# paradedb_systemd_services_to_stop_for_maintenance_list_auto is for use by the playbook that wraps this role.
# For your own custom definitions, see paradedb_systemd_services_to_stop_for_maintenance_list_custom.
paradedb_systemd_services_to_stop_for_maintenance_list_auto: []
paradedb_systemd_services_to_stop_for_maintenance_list_custom: []

# Controls whether this role will stop the ParadeDB systemd service it had started after having prepared it.
#
# As part of the installation process, this role may bring up the ParadeDB service
# and run some queries against it to prepare the additional databases, etc.
# If the service was originally stopped before these preparations and we started it just to prepare it,
# this setting would control whether we'd restore it to a stopped state.
#
# If ParadeDB was already running, it wouldn't be stopped after preparation regardless of the value of this variable.
#
# This setting only affects ParadeDB stopping as part of the preparation process.
# Other parts of this role (importing, vacuuming, etc.) may also start an originally stopped ParadeDB to do their work.
# These other parts will continue stopping such an originally-stopped ParadeDB regardless of this setting.
#
# We default this to false (don't stop), because it provides for a smoother installation experience with less stopping/starting.
# Before this setting got introduced, we used to stop the service (if it's us that started it),
# but this is now seen as wasteful work, which could delay the installation process.
paradedb_systemd_service_stop_originally_stopped_after_preparation: false

# paradedb_vacuum_presets contains various presets related to vacuuming (`--tags=run-paradedb-vacuum`).
# See: https://www.postgresql.org/docs/current/sql-vacuum.html
#
# `stopServices` specifies whether services (see `paradedb_systemd_services_to_stop_for_maintenance_list`)
# need to be stopped before a vacuuming query runs.
paradedb_vacuum_presets:
  vacuum-complete:
    query: "VACUUM FULL VERBOSE ANALYZE"
    stopsServices: true
  vacuum-full:
    query: "VACUUM FULL VERBOSE"
    stopsServices: true
  vacuum:
    query: "VACUUM VERBOSE"
    stopsServices: false
  vacuum-analyze:
    query: "VACUUM VERBOSE ANALYZE"
    stopsServices: false
  analyze:
    query: "ANALYZE VERBOSE"
    stopsServices: false

# paradedb_vacuum_default_databases_list specifies a list of databases to vacuum when running `--tags=run-paradedb-vacuum`,
# unless a `paradedb_vacuum_databases_list` extra argument is provided
paradedb_vacuum_default_databases_list: |
  {{
    (
        ([paradedb_db_name])
        +
        (paradedb_managed_databases | map(attribute='name'))
    ) | unique
  }}

paradedb_architecture: amd64

# The base container network. It will be auto-created by this role if it doesn't exist already.
paradedb_container_network: "{{ paradedb_identifier }}"

# Control if the container network is deleted on uninstalling.
paradedb_container_network_deletion_enabled: true

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
paradedb_container_additional_networks: "{{ paradedb_container_additional_networks_auto + paradedb_container_additional_networks_custom }}"
paradedb_container_additional_networks_auto: []
paradedb_container_additional_networks_custom: []

paradedb_container_image_registry_prefix: "{{ paradedb_container_image_registry_prefix_upstream }}"
paradedb_container_image_registry_prefix_upstream: "{{ paradedb_container_image_registry_prefix_upstream_default }}"
paradedb_container_image_registry_prefix_upstream_default: "docker.io/"

# paradedb_container_image_suffix controls whether we use Alpine-based images (`-alpine`) or the normal Debian-based images.
# Alpine-based ParadeDB images are smaller and we usually prefer them, but they don't work on ARM32 (tested on a Raspberry Pi 3 running Raspbian 10.7).
# On ARM32, `-alpine` images fail with the following error:
# > LOG:  startup process (PID 37) was terminated by signal 11: Segmentation fault
paradedb_container_image_suffix: "{{ '-alpine' if paradedb_architecture in ['amd64', 'arm64'] else '' }}"

paradedb_container_image_name: paradedb/paradedb

paradedb_container_image_v15: "{{ paradedb_container_image_registry_prefix }}{{ paradedb_container_image_name }}:{{ paradedb_version }}-pg15"
paradedb_container_image_v16: "{{ paradedb_container_image_registry_prefix }}{{ paradedb_container_image_name }}:{{ paradedb_version }}-pg16"
paradedb_container_image_v17: "{{ paradedb_container_image_registry_prefix }}{{ paradedb_container_image_name }}:{{ paradedb_version }}-pg17"
paradedb_container_image_v18: "{{ paradedb_container_image_registry_prefix }}{{ paradedb_container_image_name }}:{{ paradedb_version }}-pg18"

paradedb_container_image_by_major_version:
  "15": "{{ paradedb_container_image_v15 }}"
  "16": "{{ paradedb_container_image_v16 }}"
  "17": "{{ paradedb_container_image_v17 }}"
  "18": "{{ paradedb_container_image_v18 }}"

# A list of versions that are allowed to be installed and upgraded to.
# If this is an empty list (`[]`), all versions are allowed.
#
# The `paradedb_allowed_versions_auto` variable is meant to be populated by the Ansible playbook automatically.
# You can specify your own additional restrictions in the `paradedb_allowed_versions_custom` variable.
# The actual allowed versions will be the intersection of the two.
#
# Example:
# paradedb_allowed_versions: [16, 17]
paradedb_allowed_versions: "{{ paradedb_allowed_versions_custom if paradedb_allowed_versions_auto | length == 0 else (paradedb_allowed_versions_auto | intersect(paradedb_allowed_versions_custom) if paradedb_allowed_versions_custom | length > 0 else paradedb_allowed_versions_auto) }}"
paradedb_allowed_versions_auto: []
paradedb_allowed_versions_custom: []

paradedb_container_image_latest: "{{ none if paradedb_eligible_version_max is none else paradedb_container_image_by_major_version[paradedb_eligible_version_max | string] }}"

# This variable is assigned at runtime. Overriding its value has no effect.
paradedb_container_image_to_use: '{{ paradedb_container_image_latest }}'

# Controls how long to wait for the container to stop gracefully before killing it.
# Because `devture_systemd_docker_base_container_stop_grace_time_seconds` may be quite short and databases are more important to stop gracefully,
# we default to at least 30 seconds.
paradedb_container_stop_grace_time_seconds: "{{ [devture_systemd_docker_base_container_stop_grace_time_seconds, 30] | max }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
paradedb_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
paradedb_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
paradedb_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ paradedb_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ paradedb_container_stop_grace_time_seconds }} {{ paradedb_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ paradedb_identifier }} >/dev/null 2>&1 || true;
  rm -f {{ paradedb_run_path }}/.s.PGSQL.* >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ paradedb_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ paradedb_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ paradedb_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ paradedb_identifier }} after {{ paradedb_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Controls the user that the container runs as. Set to `0` to run as root.
paradedb_container_uid: "{{ paradedb_uid }}"

# Controls the group that the container runs as. Set to `0` to run as root.
paradedb_container_gid: "{{ paradedb_gid }}"

# Controls whether the container will be started with a read-only filesystem.
paradedb_container_read_only_enabled: true

# Controls whether the container will be started with dropped privileges (`--cap-drop=ALL`)
paradedb_container_cap_drop_all_enabled: true

# Controls whether the host's /etc/passwd file is mounted (as read-only) into the container (at /etc/passwd).
#
# When running as root, we don't need to do this, as the container would likely switch to an account it already contains in its own /etc/passwd file.
#
# When running as non-root, we likely need to do this as we'd like for the UID (`paradedb_uid`) we run as to resolve to a named user,
# which likely already exists in the host's /etc/passwd file.
paradedb_container_mount_etc_passwd_enabled: "{{ paradedb_uid != 0 }}"

# Specify the size of the container's tmpfs volume (/tmp)
paradedb_container_tmpfs_tmp_size: 128m

# Specify the size of the container's tmpfs volume (/run/postgresql)
paradedb_container_tmpfs_run_size: 128m

# Controls whether the ParadeDB unix socket directory is bind-mounted from the host.
# When enabled, the socket will be available under `paradedb_run_path` on the host,
# while TCP connections keep working as usual.
paradedb_container_unix_socket_enabled: true

# The unix socket directory inside the container.
paradedb_run_path_in_container: "/run/postgresql"

# Controls whether the helper CLI scripts prefer unix socket connections (when available)
# instead of TCP. This does not affect server behavior.
paradedb_cli_use_unix_socket_enabled: "{{ paradedb_container_unix_socket_enabled }}"

# A list of extra arguments to pass to the container (`docker create` command)
paradedb_container_extra_arguments: "{{ paradedb_container_extra_arguments_auto + paradedb_container_extra_arguments_custom }}"
paradedb_container_extra_arguments_auto: []
paradedb_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
paradedb_process_extra_arguments: "{{ paradedb_process_extra_arguments_default + paradedb_process_extra_arguments_unix_socket + paradedb_process_extra_arguments_auto + paradedb_process_extra_arguments_custom }}"
paradedb_process_extra_arguments_default: [
  "-c 'max_connections={{ paradedb_max_connections|int }}'",
  "-c 'shared_buffers={{ (paradedb_shared_buffers|int/1024)|int }}MB'",
  "-c 'effective_cache_size={{ (paradedb_effective_cache_size|int/1024)|int }}MB'",
  "-c 'maintenance_work_mem={{ (paradedb_maintenance_work_mem|int/1024)|int }}MB'",
  "-c 'checkpoint_completion_target={{ paradedb_checkpoint_completion_target }}'",
  "-c 'wal_buffers={{ (paradedb_wal_buffers|int/1024)|int }}MB'",
  "-c 'default_statistics_target={{ paradedb_default_statistics_target|int }}'",
  "-c 'random_page_cost={{ paradedb_random_page_cost }}'",
  "-c 'effective_io_concurrency={{ paradedb_effective_io_concurrency|int }}'",
  "-c 'work_mem={{ paradedb_work_mem|int }}kB'",
  "-c 'huge_pages={{ paradedb_huge_pages }}'",
  "-c 'min_wal_size={{ (paradedb_min_wal_size|int/1024)|int }}MB'",
  "-c 'max_wal_size={{ (paradedb_max_wal_size|int/1024)|int }}MB'",
  "-c 'max_worker_processes={{ paradedb_max_worker_processes|int }}'",
  "-c 'max_parallel_workers={{ paradedb_max_parallel_workers|int }}'",
  "-c 'max_parallel_workers_per_gather={{ paradedb_max_parallel_workers_per_gather|int }}'",
  "-c 'max_parallel_maintenance_workers={{ paradedb_max_parallel_maintenance_workers|int }}'"
]
paradedb_process_extra_arguments_unix_socket: "{{ [\"-c 'unix_socket_directories=\" ~ paradedb_run_path_in_container ~ \"'\"] if paradedb_container_unix_socket_enabled else [] }}"
# paradedb_process_extra_arguments_auto is for use by the playbook that wraps this role.
# For your own custom definitions, see paradedb_process_extra_arguments_custom.
paradedb_process_extra_arguments_auto: []
paradedb_process_extra_arguments_custom: []

# Controls whether the ParadeDB container exposes a port (tcp/5432 in the
# container) that can be used to access the database from outside the container (e.g. with psql)
#
# psql postgresql://username:password@localhost:<port>/database_name
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
paradedb_container_paradedb_bind_port: ""

paradedb_container_shm_size: "256m"

# The shell to use in the container.
# See `paradedb_container_image_suffix`.
#
# On Debian-based container images, /bin/sh tends to point to `dash` , which is subpar
# (no `set -o pipefail`, so most of our scripts would fail).
# We'd prefer /bin/bash in such container images.
#
# On Alpine, /bin/sh is /bin/busybox, which is OK.
paradedb_container_shell_path: "{{ '/bin/sh' if paradedb_container_image_suffix == '-alpine' else '/bin/bash' }}"

paradedb_systemd_required_services_list: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"

# Controls whether the systemd service only counts as started once ParadeDB accepts connections,
# so that services ordered after it (`After=`) do not find it still initializing.
# See the `ExecStartPost` in the systemd service template for how this is checked.
paradedb_systemd_readiness_check_enabled: true

# Controls how long to wait for ParadeDB to accept connections.
# If it does not within this time, the service counts as started anyway.
paradedb_systemd_readiness_check_timeout_seconds: 300

# A list of databases (and their credentials) that this role will create and manage on the server.
#
# `paradedb_managed_databases_auto` is managed by the playbook.
# Your own definitions should go into `paradedb_managed_databases_additional`
# See `paradedb_managed_databases_additional` for the correct syntax.
paradedb_managed_databases: "{{ paradedb_managed_databases_auto + paradedb_managed_databases_additional }}"

# Additional/managed database definitions managed by the playbook.
# To add your own, use `paradedb_managed_databases_additional`
paradedb_managed_databases_auto: []

# Your own additional/managed database definitions.
#
# paradedb_managed_databases_additional:
#   - name: some_database
#     username: some_username
#     password: some_password
#   - name: another_database
#     username: another_username
#     password: another_password
#     additional_sql_queries:
#       - "SOME QUERY AGAINST MAIN DATABASE HERE;"
#       - "\c another_database;"
#       - "SOME QUERY AGAINST another_database HERE;"
paradedb_managed_databases_additional: []

# A list of roles/users to avoid creating when importing (or upgrading) the database.
# If a dump file contains the roles and they've also been created beforehand (see `paradedb_managed_databases`),
# importing would fail.
# We either need to not create them or to ignore the `CREATE ROLE` statements in the dump.
paradedb_import_roles_to_ignore: "{{ (paradedb_import_roles_to_ignore_default + paradedb_import_roles_to_ignore_auto + paradedb_import_roles_to_ignore_custom) | unique }}"
paradedb_import_roles_to_ignore_default: |
  {{
    (
      [paradedb_connection_username]
      +
      paradedb_managed_databases | map(attribute='username') | list
    ) | unique
  }}
paradedb_import_roles_to_ignore_auto: []
paradedb_import_roles_to_ignore_custom: []

# When importing an existing ParadeDB database (when restoring a backup) or when doing a ParadeDB upgrade (which dumps & restores), we'd like to avoid:
# - creating users (`CREATE ROLE ..`)
# - updating passwords for users (`ALTER ROLE root WITH SUPERUSER INHERIT NOCREATEROLE NOCREATEDB LOGIN NOREPLICATION NOBYPASSRLS PASSWORD 'md5...`)
#
# Both of these operations are done by the playbook anyway.
# Updating passwords is especially undesirable, because older versions hash passwords using md5 and export them as md5 hashes in the dump file,
# which is unsupported by default by newer ParadeDB versions (v14+).
# When users are created and passwords are set by the playbook, they end up hashed as `scram-sha-256` on ParadeDB v14+.
# If an md5-hashed password is restored on top, ParadeDB v14+ will refuse to authenticate users with it by default.
#
# We also allow for the role name to be quoted, which is rare, but might happen for role names which are special keywords (e.g. `default`).
paradedb_import_roles_ignore_regex: "^(CREATE|ALTER) ROLE \\\"?({{ paradedb_import_roles_to_ignore | join('|') }})\\\"?(;| WITH)"  # noqa jinja[spacing]

# A list of databases to avoid creating when importing (or upgrading) the database.
# If a dump file contains the databases and they've also been created beforehand (see `paradedb_managed_databases`),
# importing would fail.
# We either need to not create them or to ignore the `CREATE DATABASE` statements in the dump.
paradedb_import_databases_to_ignore: "{{ (paradedb_import_databases_to_ignore_default + paradedb_import_databases_to_ignore_auto + paradedb_import_databases_to_ignore_custom) | unique }}"
paradedb_import_databases_to_ignore_default: |
  {{
    (
      [paradedb_db_name]
      +
      paradedb_managed_databases | map(attribute='name') | list
    ) | unique
  }}
paradedb_import_databases_to_ignore_auto: []
paradedb_import_databases_to_ignore_custom: []

# We also allow for the database name to be quoted, which is rare, but might happen for database names which are special keywords (e.g. `default`).
paradedb_import_databases_ignore_regex: "^CREATE DATABASE \\\"?({{ paradedb_import_databases_to_ignore | join('|') }})\\\"?\\s" # noqa jinja[spacing]

# A list of schemas to avoid creating when importing (or upgrading) the database.
paradedb_import_schemas_to_ignore: "{{ (paradedb_import_schemas_to_ignore_default + paradedb_import_schemas_to_ignore_auto + paradedb_import_schemas_to_ignore_custom) | unique }}"
paradedb_import_schemas_to_ignore_default: []
paradedb_import_schemas_to_ignore_auto: []
paradedb_import_schemas_to_ignore_custom: []

# We also allow for the schema name to be quoted, which is rare, but might happen for schema names which are special keywords.
paradedb_import_schemas_ignore_regex: "^CREATE SCHEMA \\\"?({{ paradedb_import_schemas_to_ignore | join('|') }})\\\"?\\s" # noqa jinja[spacing]

# The number of seconds to wait after starting ParadeDB systemd service
# and before trying to run queries for initializing managed databases/users against it.
#
# For most (subsequent) runs, ParadeDB would already be running, so no waiting will be happening at all.
#
# With `paradedb_systemd_readiness_check_enabled`, no waiting is needed at all: starting the systemd service
# only completes once ParadeDB accepts connections (see the `ExecStartPost` in the systemd service template),
# so any fixed delay on top of that would only slow things down.
#
# Otherwise, we wait a fixed amount of time and hope that it's enough.
# On ARM, we wait some more. ARM32 devices are especially known for being slow.
# ARM64 likely don't need such a long delay, but it doesn't hurt too much having it.
paradedb_managed_databases_paradedb_start_wait_timeout_seconds: "{{ 0 if paradedb_systemd_readiness_check_enabled | bool else (45 if paradedb_architecture in ['arm32', 'arm64'] else 15) }}"

# Controls how many times (and how many seconds apart) initializing managed databases/users is retried,
# when it fails because ParadeDB cannot be connected to (e.g. it is still starting up after the wait above).
paradedb_managed_databases_connection_retries: 10
paradedb_managed_databases_connection_retry_delay_seconds: 3

# Defines the `PGDATA` environment variable for the ParadeDB server.
#
# We explicitly set it to avoid surprises caused by ParadeDB >= v18 which changed the default value for this
# (from `/var/lib/postgresql/data` to `/var/lib/postgresql/MAJOR/docker`).
# Ref: https://github.com/docker-library/paradedb/pull/1259
#
# We intentionally set this to `/data` (see `paradedb_data_in_container_path`), not `/var/lib/postgresql/data` (like the old value),
# because `/var/lib/postgresql` is defined as a VOLUME already in the official container image,
# which makes it impossible to bind-mount directories beneath it.
# Ref: https://github.com/docker-library/paradedb/pull/1259#issuecomment-2215489177
#
# We could have also adopted the new data layout (used by ParadeDB v18+), but this necessitates:
# - a data migration (for the files stored in `paradedb_data_path`),
# - reworking of our ParadeDB version detection logic (`tasks/detect_existing_paradedb_version.yml`)
# - etc.
#
# The new data layout promises to make it possible to do faster (`pg_upgrade --link`) upgrades between major ParadeDB versions,
# instead of having to do a dump and restore.
# However, this is an empty promise, because for `pg_upgrade` to work, one also needs to have both old & new ParadeDB binaries available,
# which is not the case for the official container image.
# As it is now, adopting the new data layout would only lead to pain, without any gain.
#
# Because of all this, we keep the old data layout. In the future, this may change.
paradedb_server_environment_variable_pgdata: "{{ paradedb_data_in_container_path }}"

paradedb_pgloader_container_image_self_build: "{{ paradedb_architecture != 'amd64' }}"
paradedb_pgloader_container_image_self_build_repo: "https://github.com/illagrenan/pgloader-docker.git"
paradedb_pgloader_container_image_self_build_repo_branch: "v{{ paradedb_pgloader_container_image_tag }}"
paradedb_pgloader_container_image_self_build_src_path: "{{ paradedb_base_path }}/pgloader-container-src"

# We use illagrenan/pgloader, instead of the more official dimitri/pgloader image,
# because the official one only provides a `latest` tag.
paradedb_pgloader_container_image: "{{ paradedb_pgloader_container_image_registry_prefix }}illagrenan/pgloader:{{ paradedb_pgloader_container_image_tag }}"
paradedb_pgloader_container_image_registry_prefix: "{{ 'localhost/' if paradedb_pgloader_container_image_self_build else paradedb_pgloader_container_image_registry_prefix_upstream }}"
paradedb_pgloader_container_image_registry_prefix_upstream: "{{ paradedb_pgloader_container_image_registry_prefix_upstream_default }}"
paradedb_pgloader_container_image_registry_prefix_upstream_default: "docker.io/"
paradedb_pgloader_container_image_tag: "3.6.2"

# paradedb_restart_necessary controls whether the ParadeDB systemd service
# will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
paradedb_restart_necessary: false
