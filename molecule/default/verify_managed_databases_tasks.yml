---
- name: Query the owner of the managed database
  ansible.builtin.command:
    cmd: >-
      /paradedb/bin/cli-non-interactive -tAc
      "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '{{ paradedb_verify_managed_db.name }}'"
  register: paradedb_verify_managed_db_owner
  changed_when: false

- name: Query the extensions in the managed database
  ansible.builtin.command:
    cmd: >-
      /paradedb/bin/cli-non-interactive -d {{ paradedb_verify_managed_db.name }} -tAc
      "SELECT extname FROM pg_extension WHERE extname = 'pg_trgm'"
  register: paradedb_verify_managed_db_extensions
  changed_when: false

- name: Determine the ParadeDB container image
  ansible.builtin.command:
    cmd: docker container inspect paradedb --format '{% raw %}{{.Config.Image}}{% endraw %}'
  register: paradedb_verify_container_image
  changed_when: false

# Over the container network like a service would, so that password authentication
# applies (connections from inside the ParadeDB container itself may be trusted).
- name: Log in to the managed database as its user
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network=paradedb
      - --env=PGPASSWORD={{ paradedb_verify_managed_db.password }}
      - "{{ paradedb_verify_container_image.stdout }}"
      - psql
      - --host=paradedb
      - --username={{ paradedb_verify_managed_db.username }}
      - --dbname={{ paradedb_verify_managed_db.name }}
      - -tAc
      - SELECT current_user
  register: paradedb_verify_managed_db_login
  changed_when: false
  failed_when: false

# Only `additional_sql_queries` create the extension (after switching to their database via `\c`),
# so it must not show up in a database prepared after one which did that.
- name: Assert the managed database is prepared
  vars:
    paradedb_verify_managed_db_expected_extension: "{{ 'pg_trgm' if paradedb_verify_managed_db.additional_sql_queries is defined else '' }}"
  ansible.builtin.assert:
    that:
      - paradedb_verify_managed_db_owner.stdout == paradedb_verify_managed_db.username
      - paradedb_verify_managed_db_extensions.stdout == paradedb_verify_managed_db_expected_extension
      - paradedb_verify_managed_db_login.rc == 0
      - paradedb_verify_managed_db_login.stdout == paradedb_verify_managed_db.username
    fail_msg: >-
      The managed database `{{ paradedb_verify_managed_db.name }}` is not prepared as expected.
      Owner: `{{ paradedb_verify_managed_db_owner.stdout }}`,
      pg_trgm extension: `{{ paradedb_verify_managed_db_extensions.stdout }}`,
      login as `{{ paradedb_verify_managed_db.username }}` (rc={{ paradedb_verify_managed_db_login.rc }}):
      `{{ paradedb_verify_managed_db_login.stdout }}{{ paradedb_verify_managed_db_login.stderr }}`
    success_msg: >-
      `{{ paradedb_verify_managed_db.name }}` is owned by `{{ paradedb_verify_managed_db.username }}`,
      {{ 'has' if paradedb_verify_managed_db_expected_extension else 'does not have' }} the pg_trgm extension,
      and its user can log in with its password
