---
# This utility aims to determine if there is some existing ParadeDB version in use or not.
# If there is, it also tries to detect the container image that corresponds to that version.
#
# This utility is intentionally not in `tasks/util`, because if it were, it wouldn't be possible
# to include it in other roles via the include_role module: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_role_module.html

- name: Initialize ParadeDB version determination variables (default to empty)
  ansible.builtin.set_fact:
    paradedb_detection_pg_version_path: "{{ paradedb_data_path }}/PG_VERSION"
    paradedb_detected_existing: false
    paradedb_detected_version_string: ""
    paradedb_detected_version_number: 0
    paradedb_detected_version_corresponding_container_image: ""

- name: Determine existing ParadeDB version (check PG_VERSION file)
  ansible.builtin.stat:
    path: "{{ paradedb_detection_pg_version_path }}"
  register: result_pg_version_stat

- ansible.builtin.set_fact:
    paradedb_detected_existing: true
  when: "result_pg_version_stat.stat.exists"

- name: Determine existing ParadeDB version (if detected)
  when: paradedb_detected_existing | bool
  block:
    - name: Determine existing ParadeDB version (read PG_VERSION file)
      ansible.builtin.slurp:
        src: "{{ paradedb_detection_pg_version_path }}"
      register: result_pg_version

    - name: Determine existing ParadeDB version (make sense of PG_VERSION file)
      ansible.builtin.set_fact:
        paradedb_detected_version_string: "{{ result_pg_version['content'] | b64decode | replace('\n', '') }}"

    - name: Determine corresponding container image to detected version (use 9.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 9
      when: "paradedb_detected_version_string.startswith('9.')"

    - name: Determine corresponding container image to detected version (use 10.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 10
      when: "paradedb_detected_version_string == '10' or paradedb_detected_version_string.startswith('10.')"

    - name: Determine corresponding container image to detected version (use 11.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 11
      when: "paradedb_detected_version_string == '11' or paradedb_detected_version_string.startswith('11.')"

    - name: Determine corresponding container image to detected version (use 12.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 12
      when: "paradedb_detected_version_string == '12' or paradedb_detected_version_string.startswith('12.')"

    - name: Determine corresponding container image to detected version (use 13.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 13
      when: "paradedb_detected_version_string == '13' or paradedb_detected_version_string.startswith('13.')"

    - name: Determine corresponding container image to detected version (use 14.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 14
      when: "paradedb_detected_version_string == '14' or paradedb_detected_version_string.startswith('14.')"

    - name: Determine corresponding container image to detected version (use 15.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 15
      when: "paradedb_detected_version_string == '15' or paradedb_detected_version_string.startswith('15.')"

    - name: Determine corresponding container image to detected version (use 16.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 16
      when: "paradedb_detected_version_string == '16' or paradedb_detected_version_string.startswith('16.')"

    - name: Determine corresponding container image to detected version (use 17.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 17
      when: "paradedb_detected_version_string == '17' or paradedb_detected_version_string.startswith('17.')"

    - name: Determine corresponding container image to detected version (use 18.x, if detected)
      ansible.builtin.set_fact:
        paradedb_detected_version_number: 18
      when: "paradedb_detected_version_string == '18' or paradedb_detected_version_string.startswith('18.')"

    - name: Fail if detected ParadeDB version number not known to us
      ansible.builtin.fail:
        msg: "Unknown ParadeDB version number: {{ paradedb_detected_version_number }}"
      when: "paradedb_detected_version_number not in paradedb_known_versions"

    - name: Populate corresponding ParadeDB container image based on detected version
      ansible.builtin.set_fact:
        paradedb_detected_version_corresponding_container_image: "{{ paradedb_container_image_by_major_version[paradedb_detected_version_number | string] }}"
