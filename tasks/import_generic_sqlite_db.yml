---
# Pre-checks

- name: Fail if playbook called incorrectly
  ansible.builtin.fail:
    msg: "The `sqlite_database_path` variable needs to be provided to this playbook, via --extra-vars"
  when: "sqlite_database_path is not defined or sqlite_database_path.startswith('<')"

- name: Check if the provided SQLite database file exists
  ansible.builtin.stat:
    path: "{{ sqlite_database_path }}"
  register: sqlite_database_path_stat_result

- name: Fail if provided SQLite database file doesn't exist
  ansible.builtin.fail:
    msg: "File cannot be found on the server at {{ sqlite_database_path }}"
  when: "not sqlite_database_path_stat_result.stat.exists"

# We either expect `paradedb_db_connection_string` specifying a full ParadeDB database connection string,
# or `paradedb_connection_string_variable_name`, specifying a name of a variable, which contains a valid connection string.

- when: "paradedb_connection_string_variable_name is defined"
  block:
    - name: Fail if paradedb_connection_string_variable_name points to an undefined variable
      ansible.builtin.fail:
        msg: "paradedb_connection_string_variable_name is defined, but there is no variable with the name `{{ paradedb_connection_string_variable_name }}`"
      when: "lookup('ansible.builtin.varnames', ('^paradedb_connection_string_variable_name$'), wantlist=True) | length == 0"

    - name: Get ParadeDB connection string from variable
      ansible.builtin.set_fact:
        paradedb_db_connection_string: "{{ lookup('vars', paradedb_connection_string_variable_name) }}"

- name: Fail if playbook called incorrectly
  ansible.builtin.fail:
    msg: >-
      Either a `paradedb_db_connection_string` variable or a `paradedb_connection_string_variable_name` needs to be provided to this playbook, via `--extra-vars`.
      Example: `--extra-vars="paradedb_db_connection_string=paradedbql://username:password@localhost:<port>/database_name"` or `--extra-vars="paradedb_connection_string_variable_name=some_variable_connString"`
  when: "paradedb_db_connection_string is not defined or not paradedb_db_connection_string.startswith('paradedbql://')"

# Defaults

# No waiting is needed with the readiness check (see `paradedb_managed_databases_paradedb_start_wait_timeout_seconds`).
- name: Set paradedb_start_wait_time, if not provided
  ansible.builtin.set_fact:
    paradedb_start_wait_time: "{{ 0 if paradedb_systemd_readiness_check_enabled | bool else 15 }}"
  when: "paradedb_start_wait_time | default('') == ''"

# Actual import work

- name: Ensure ParadeDB service is started
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: started
    daemon_reload: true
  register: paradedb_ensure_started_result

- name: Wait a bit, so that ParadeDB can start
  ansible.builtin.wait_for:
    timeout: "{{ paradedb_start_wait_time }}"
  delegate_to: 127.0.0.1
  become: false
  when: "paradedb_ensure_started_result.changed | bool and (paradedb_start_wait_time | int) > 0"

# The connection string contains a password. We pass it to pgloader via an environment file
# (referenced by the pgloader command via an environment variable), instead of passing it on the
# command line, where it would leak into the process list and into Ansible's error output if the
# import fails. We use a uniquely-named temporary file (not a fixed path), so that concurrent
# invocations against the same ParadeDB instance do not overwrite one another's connection string.
- name: Create a temporary file for holding the pgloader connection string
  ansible.builtin.tempfile:
    state: file
    path: "{{ paradedb_base_path }}"
    prefix: .env-paradedb-pgloader
  register: paradedb_import_generic_sqlite_db_env_file

- name: Perform pgloader import
  block:
    - name: Populate the pgloader environment file
      ansible.builtin.copy:
        content: "POSTGRES_DB_CONNECTION_STRING={{ paradedb_db_connection_string }}"
        dest: "{{ paradedb_import_generic_sqlite_db_env_file.path }}"
        mode: '0600'
      no_log: true

    - name: Import SQLite database from {{ sqlite_database_path }} into ParadeDB # noqa name[template]
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} run
          --rm
          --user={{ paradedb_container_uid }}:{{ paradedb_container_gid }}
          --cap-drop=ALL
          --env-file={{ paradedb_import_generic_sqlite_db_env_file.path }}
          --network={{ paradedb_container_network }}
          --mount type=bind,src={{ sqlite_database_path }},dst=/in.db,ro
          --entrypoint={{ paradedb_container_shell_path }}
          {{ paradedb_pgloader_container_image }}
          -c
          'pgloader /in.db "$POSTGRES_DB_CONNECTION_STRING"'
      register: paradedb_import_generic_sqlite_db_import_result
      changed_when: paradedb_import_generic_sqlite_db_import_result.rc == 0
  always:
    - name: Remove the temporary pgloader environment file
      ansible.builtin.file:
        path: "{{ paradedb_import_generic_sqlite_db_env_file.path }}"
        state: absent

- name: Archive SQLite database ({{ sqlite_database_path }} -> {{ sqlite_database_path }}.backup) # noqa name[template]
  ansible.builtin.command:
    cmd: "mv {{ sqlite_database_path }} {{ sqlite_database_path }}.backup"
  register: paradedb_import_generic_sqlite_db_move_result
  changed_when: paradedb_import_generic_sqlite_db_move_result.rc == 0

- name: Inject result
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "NOTE: Your SQLite database file has been imported into ParadeDB. The original file has been moved from `" + sqlite_database_path + "` to `" + sqlite_database_path + ".backup`. When you've confirmed that the import went well and everything works, you should be able to safely delete this file."
        ]
      }}

- name: Ensure ParadeDB is stopped (if it previously was)
  when: "paradedb_ensure_started_result.changed | bool"
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: stopped
