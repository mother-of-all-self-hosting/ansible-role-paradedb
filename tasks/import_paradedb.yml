---
# Pre-checks

- name: Fail if playbook called incorrectly
  ansible.builtin.fail:
    msg: "The `server_path_paradedb_dump` variable needs to be provided to this playbook, via --extra-vars"
  when: "server_path_paradedb_dump is not defined or server_path_paradedb_dump.startswith('<')"

- name: Check if the provided ParadeDB dump file exists
  ansible.builtin.stat:
    path: "{{ server_path_paradedb_dump }}"
  register: result_server_path_paradedb_dump_stat

- name: Fail if provided ParadeDB dump file does not exists
  ansible.builtin.fail:
    msg: "File cannot be found on the server at {{ server_path_paradedb_dump }}"
  when: "not result_server_path_paradedb_dump_stat.stat.exists"

# Defaults

# No waiting is needed with the readiness check (see `paradedb_managed_databases_paradedb_start_wait_timeout_seconds`).
- name: Set paradedb_start_wait_time, if not provided
  ansible.builtin.set_fact:
    paradedb_start_wait_time: "{{ 0 if paradedb_systemd_readiness_check_enabled | bool else 15 }}"
  when: "paradedb_start_wait_time | default('') == ''"

- name: Set paradedb_import_wait_time, if not provided
  ansible.builtin.set_fact:
    paradedb_import_wait_time: "{{ 7 * 86400 }}"
  when: "paradedb_import_wait_time | default('') == ''"

# By default, we connect and import into the main (`default`) database.
# Single-database dumps may wish to import into a specific database instead by passing an `paradedb_default_import_database` extra-vars variable.
- name: Set paradedb_default_import_database, if not provided
  ansible.builtin.set_fact:
    paradedb_default_import_database: "{{ paradedb_db_name }}"
  when: "paradedb_default_import_database | default('') == ''"

# Actual import work

- name: Ensure ParadeDB service is started
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: started
    daemon_reload: true
  register: paradedb_ensure_started_result

- name: Wait a bit, so that ParadeDB can start
  when: "paradedb_ensure_started_result.changed | bool and (paradedb_start_wait_time | int) > 0"
  ansible.builtin.wait_for:
    timeout: "{{ paradedb_start_wait_time }}"
  delegate_to: 127.0.0.1
  become: false

- ansible.builtin.import_tasks: tasks/detect_existing_paradedb_version.yml

- name: Abort, if no existing ParadeDB version detected
  ansible.builtin.fail:
    msg: "Could not find existing ParadeDB installation"
  when: "not paradedb_detected_existing | bool"

# Starting the database container had automatically created the default
# role (`paradedb_connection_username`) and database (`paradedb_db_name`).
# The dump most likely contains those same entries and would try to re-create them, leading to errors.
# We need to skip over those lines.
#
# The dump is streamed into psql inside the (running) ParadeDB container, which connects the same way
# the managed databases preparation does, with the credentials from the env-paradedb-psql file (which Docker reads itself).
- name: Generate ParadeDB database import command
  ansible.builtin.set_fact:
    paradedb_import_command: >-
      {{ devture_systemd_docker_base_host_command_docker }} exec -i
      --env-file={{ paradedb_base_path }}/env-paradedb-psql
      {{ paradedb_identifier }}
      {{ paradedb_container_shell_path }}
      -c "set -o pipefail && cat |
      {{ 'gunzip |' if server_path_paradedb_dump.endswith('.gz') else '' }}
      {{ 'unzstd |' if server_path_paradedb_dump.endswith('.zst') else '' }}
      {% if paradedb_import_roles_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_roles_ignore_regex }}' |
      {% endif %}
      {% if paradedb_import_databases_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_databases_ignore_regex }}' |
      {% endif %}
      {% if paradedb_import_schemas_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_schemas_ignore_regex }}' |
      {% endif %}
      psql -b -v ON_ERROR_STOP=1 -h 127.0.0.1 --dbname={{ paradedb_default_import_database }}"
      < {{ server_path_paradedb_dump | quote }}
  tags:
    - skip_ansible_lint

# This is a hack.
# See: https://ansibledaily.com/print-to-standard-output-without-escaping/
#
# We want to run `debug: msg=".."`, but that dumps it as JSON and escapes double quotes within it,
# which ruins the command (`paradedb_import_command`)
- name: Note about ParadeDB importing alternative
  ansible.builtin.set_fact:
    dummy: true
  with_items:
    - >-
      Importing ParadeDB database using the following command: `{{ paradedb_import_command }}`.
      If this crashes, you can stop ParadeDB (`systemctl stop {{ paradedb_identifier }}`),
      delete its existing data (`rm -rf {{ paradedb_data_path }}/*`), start it again (`systemctl start {{ paradedb_identifier }}`)
      and manually run the above import command directly on the server.

# A shell, as the dump is fed to the command on stdin (the redirection is part of `paradedb_import_command`).
- name: Perform ParadeDB database import
  ansible.builtin.shell:
    cmd: "{{ paradedb_import_command }}"
  async: "{{ paradedb_import_wait_time }}"
  poll: 10
  register: paradedb_import_paradedb_command_result
  failed_when: not paradedb_import_paradedb_command_result.finished or paradedb_import_paradedb_command_result.rc != 0
  changed_when: paradedb_import_paradedb_command_result.finished and paradedb_import_paradedb_command_result.rc == 0

- name: Ensure ParadeDB is stopped (if it previously was)
  when: "paradedb_ensure_started_result.changed | bool"
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: stopped
