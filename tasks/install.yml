---
- ansible.builtin.import_tasks: "{{ role_path }}/tasks/migrate_paradedb_data_directory.yml"

- ansible.builtin.import_tasks: "{{ role_path }}/tasks/detect_existing_paradedb_version.yml"

- when: paradedb_detected_existing | bool
  block:
    - name: Abort if on an unsupported ParadeDB version
      ansible.builtin.fail:
        msg: "You're on ParadeDB {{ paradedb_detected_version }}, which is no longer supported. To upgrade, see docs/maintenance-paradedb.md"
      when: "paradedb_detected_version_number == 9"

    - name: Inject warning if detected ParadeDB version number not eligible
      when: "paradedb_detected_version_number not in paradedb_eligible_versions"
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "WARNING: We detected that ParadeDB version (" + paradedb_detected_version_number | string + ") is already installed, but it's not normally eligible for installation for your setup. You or some other role is currently restricting `paradedb_allowed_versions` to " + paradedb_allowed_versions | to_json + " for compatibility reasons. Perhaps this other role does not support other ParadeDB versions. You can suppress this warning by force-settting `paradedb_allowed_versions` to something like [" + paradedb_detected_version_number | to_json + "], though it would be better to figure out where the restriction comes from and to potentially downgrade ParadeDB to the maximum allowed version (" + paradedb_eligible_version_max | string + ") imposed by the current restrictions.",
            ]
          }}

    - name: Inject warning if on maximum eligible ParadeDB version, but held back from the maximum known version
      when: "paradedb_detected_version_number == paradedb_eligible_version_max and paradedb_eligible_version_max < paradedb_known_version_max"
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "NOTE: We detected that ParadeDB version (" + paradedb_detected_version_number | string + ") is already installed. While a newer version (" + paradedb_known_version_max | string + ") is normally available, it's not eligible for installation for your setup. You or some other role is currently restricting `paradedb_allowed_versions` (likely via `paradedb_allowed_versions_auto` or `paradedb_allowed_versions_custom`) to " + paradedb_allowed_versions | to_json + " for compatibility reasons. Perhaps this other role does not support the newer ParadeDB version.",
            ]
          }}

    - name: Inject warning if on an old version of ParadeDB
      ansible.builtin.set_fact:
        devture_playbook_runtime_messages_list: |
          {{
            devture_playbook_runtime_messages_list | default([])
            +
            [
              "NOTE: Your setup is on an old ParadeDB version (" + paradedb_detected_version_number | string + ") and can be upgraded to version " + paradedb_available_upgrade_versions | max | string + ". To upgrade, re-run the playbook with `--tags=upgrade-paradedb` on its own. Do not combine it with `setup-all`/`setup-paradedb`/`install-all`/`install-paradedb`. See your playbook's ParadeDB maintenance documentation for details."
            ]
          }}
      when: "paradedb_detected_existing and paradedb_available_upgrade_versions | length > 0"

    # If we have found an existing version (installed from before), we use its corresponding container image.
    # If not, we let `paradedb_container_image_to_use` default to the latest eligible version.
    #
    # Upgrading is supposed to be performed separately and explicitly (see `upgrade_paradedb.yml`).
    - ansible.builtin.set_fact:
        paradedb_container_image_to_use: "{{ paradedb_detected_version_corresponding_container_image }}"

# Even if we don't run the internal server, we still need this for running the CLI
- name: Ensure ParadeDB container image is pulled
  community.docker.docker_image_pull:
    name: "{{ paradedb_container_image_to_use }}"
    pull: always
  register: paradedb_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: paradedb_container_image_pull_result is not failed

# Owned by root: root runs the scripts in the bin path and reads the environment variables files.
# Whoever owns the base path could rename the bin path (even a root-owned one) and put another in its place.
- name: Ensure ParadeDB base paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ paradedb_gid }}"
  with_items:
    - "{{ paradedb_base_path }}"
    - "{{ paradedb_bin_path }}"

- name: Ensure ParadeDB data path exists
  ansible.builtin.file:
    path: "{{ paradedb_data_path }}"
    state: directory
    mode: "0700"
    owner: "{{ paradedb_uid }}"
    group: "{{ paradedb_gid }}"

# The container's entrypoint changes the mode of this directory (bind-mounted to `/var/run/postgresql`) to 3775
# whenever it starts, so the same mode is used here (instead of fighting over it and always reporting a change).
- name: Ensure ParadeDB run path exists
  ansible.builtin.file:
    path: "{{ paradedb_run_path }}"
    state: directory
    mode: "3775"
    owner: "{{ paradedb_uid }}"
    group: "{{ paradedb_gid }}"
  when: paradedb_container_unix_socket_enabled
# Separate task to allow different permissions for unix socket access.

- name: Ensure ParadeDB environment variables file created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ paradedb_base_path }}/{{ item }}"
    owner: root
    group: "{{ paradedb_gid }}"
    mode: "0640"
  with_items:
    - "env-paradedb-psql"
    - "env-paradedb-server"
  register: paradedb_config_file_result

- name: Ensure ParadeDB scripts created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/bin/{{ item }}.j2"
    dest: "{{ paradedb_bin_path }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  with_items:
    - cli
    - cli-non-interactive
    - dump-all

- name: Ensure ParadeDB container network is created
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ paradedb_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure ParadeDB systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/paradedb.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ paradedb_identifier }}.service"
    mode: "0644"
  register: paradedb_systemd_service_result

- name: Determine whether ParadeDB needs a restart
  ansible.builtin.set_fact:
    paradedb_restart_necessary: >-
      {{
        paradedb_config_file_result.changed | default(false)
        or paradedb_systemd_service_result.changed | default(false)
        or paradedb_container_image_pull_result.changed | default(false)
      }}

- name: Ensure managed ParadeDB databases prepared
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/util/prepare_managed_databases.yml"
    apply:
      tags:
        - always
  when: "paradedb_managed_databases|length > 0"

- name: Check existence of ParadeDB backup data path
  ansible.builtin.stat:
    path: "{{ paradedb_data_path }}-auto-upgrade-backup"
  register: paradedb_data_backup_path_stat

- name: Inject warning if backup data remains
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "NOTE: You have some ParadeDB backup data in `" + paradedb_data_path + "-auto-upgrade-backup`, which was created during the last major ParadeDB update you ran. If your setup works well after this upgrade, feel free to delete this whole directory."
        ]
      }}
  when: "paradedb_data_backup_path_stat.stat.exists"
