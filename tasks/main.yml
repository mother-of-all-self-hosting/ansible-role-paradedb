---

- block:
    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"

    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"
  tags:
    - setup-all
    - setup-paradedb
    - install-all
    - install-paradedb

- block:
    - when: not paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
  tags:
    - setup-all
    - setup-paradedb

- block:
    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/import_paradedb.yml"
  tags:
    - import-paradedb
    - molecule-notest

- block:
    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/import_generic_sqlite_db.yml"
  tags:
    - import-generic-sqlite-db
    - molecule-notest

- block:
    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/upgrade_paradedb.yml"
  tags:
    - molecule-notest
    - upgrade-paradedb

- block:
    - when: paradedb_enabled | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/run_vacuum.yml"
  tags:
    - molecule-notest
    - run-paradedb-vacuum
