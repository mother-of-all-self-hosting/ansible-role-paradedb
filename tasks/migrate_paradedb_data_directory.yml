---
# We used to store ParadeDB data directly under `/{service}/paradedb` (what is now considered `paradedb_base_path`).
#
# From now on, we expect to store ParadeDB data one directory below now (`/{service}/paradedb/data` - `paradedb_data_path`).
# We wish to use the base directory for other purposes (storing environment variable files, etc.).
# Mixing those with the ParadeDB data is no good and it leads to ParadeDB's `initdb` complaining to initialize
# a database in a non-empty directory.
#
# For this reason, we store the ParadeDB data in `/{service}/paradedb/data` and need to relocate any installations
# which still store it in the parent directory (`/{service}/paradedb`).
#
# This utility is intentionally not in `tasks/util`, because if it were, it wouldn't be possible
# to include it in other roles via the import_role module: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/import_role_module.html

- name: Check if old ParadeDB data directory is used
  ansible.builtin.stat:
    path: "{{ paradedb_base_path }}/PG_VERSION"
  register: result_pg_old_data_dir_stat

- name: Warn if old ParadeDB data directory detected
  ansible.builtin.debug:
    msg: >-
      Found that you have ParadeDB data in `{{ paradedb_base_path }}`.
      From now on, ParadeDB data is supposed to be stored in `{{ paradedb_data_path }}` instead.
      We'll stop ParadeDB and relocate the files there for you.
  when: "result_pg_old_data_dir_stat.stat.exists"

# We should stop ParadeDB first, before building a list of files,
# as to ignore any `postmaster.pid` files, etc.
- name: Ensure ParadeDB is stopped
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: stopped
    daemon_reload: true
  when: "result_pg_old_data_dir_stat.stat.exists"

- name: Find files and directories in old ParadeDB data path
  ansible.builtin.find:
    paths: "{{ paradedb_base_path }}"
    file_type: any
    excludes: ["data"]
  register: "result_pg_old_data_dir_find"
  when: "result_pg_old_data_dir_stat.stat.exists"

- name: Ensure new ParadeDB data path exists
  ansible.builtin.file:
    path: "{{ paradedb_data_path }}"
    state: directory
    mode: "0700"
    owner: "{{ paradedb_uid }}"
    group: "{{ paradedb_gid }}"
  when: "result_pg_old_data_dir_stat.stat.exists"

- when: "result_pg_old_data_dir_stat.stat.exists"
  block:
    - name: Relocate ParadeDB data files from old directory to new
      ansible.builtin.command:
        cmd: "mv {{ item.path }} {{ paradedb_data_path }}/{{ item.path | basename }}"
      with_items: "{{ result_pg_old_data_dir_find.files }}"
      register: paradedb_migrate_paradedb_data_directory_move_result
      changed_when: paradedb_migrate_paradedb_data_directory_move_result.rc == 0

# Intentionally not starting ParadeDB here.
# It likely needs to be updated to point to the new directory.
# In fact, let's even get rid of the outdated service, to ensure no one will start it
# and have it initialize a new database.

- name: Ensure outdated ParadeDB service does not exist
  ansible.builtin.file:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ paradedb_identifier }}.service"
    state: absent
  when: "result_pg_old_data_dir_stat.stat.exists"

- name: Ensure systemd reloaded after getting rid of outdated ParadeDB service
  ansible.builtin.service:
    daemon_reload: true
  when: "result_pg_old_data_dir_stat.stat.exists"

# We don't try to restart ParadeDB here.
# We've just stopped it, relocated the data and cleaned up a bit, but we haven't configured it anew yet, so we can't start it.
