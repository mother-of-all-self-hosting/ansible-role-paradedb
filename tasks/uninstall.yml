---
- name: Check existence of ParadeDB systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ paradedb_identifier }}.service"
  register: paradedb_service_stat

- name: Uninstall ParadeDB systemd service and scripts
  when: paradedb_service_stat.stat.exists | bool
  block:
    - name: Ensure ParadeDB systemd service is stopped
      ansible.builtin.service:
        name: "{{ paradedb_identifier }}"
        state: stopped
        daemon_reload: true

    - name: Ensure ParadeDB systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ paradedb_identifier }}.service"
        state: absent

    - name: Ensure ParadeDB scripts do not exist
      ansible.builtin.file:
        path: "{{ paradedb_bin_path }}"
        state: absent

    - name: Ensure ParadeDB container network does not exist
      when: paradedb_container_network_deletion_enabled and paradedb_container_network != 'host'
      block:
        - name: Ensure ParadeDB container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ paradedb_container_network }}"
            state: absent
          register: paradedb_network_deletion_result

        - name: Ensure ParadeDB container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ paradedb_container_network }}
          register: paradedb_network_deletion_result
          changed_when: paradedb_container_network in paradedb_network_deletion_result.stdout

- name: Check existence of ParadeDB local data path
  ansible.builtin.stat:
    path: "{{ paradedb_data_path }}"
  register: paradedb_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining ParadeDB local data path
  when: paradedb_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: You are not using a local ParadeDB database, but some old data remains from before in `" + paradedb_data_path + "`. Feel free to delete it."
        ]
      }}
