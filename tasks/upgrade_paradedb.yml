---
# The `upgrade-paradedb` tag is meant to be run on its own.
#
# When combined with `setup-all`/`setup-paradedb`/`install-all`/`install-paradedb` (or with the
# implicit `all` tag — i.e., no `--tags` at all), the install pass runs first and pins
# `paradedb_container_image_to_use` to the *currently-installed* major version (so the playbook
# does not auto-upgrade unintentionally). The upgrade pass then re-runs install with that same
# pinned image, so the dump is restored into the same version you started on — a silent no-op
# upgrade that round-trips your data through pg_dumpall for no reason.
- name: Fail if upgrade-paradedb is combined with setup/install tags
  ansible.builtin.fail:
    msg: |-
      Refusing to upgrade ParadeDB while another tag from
      `all`, `setup-all`, `setup-paradedb`, `install-all`, `install-paradedb`
      is also active.

      Combining these tags is unsafe: the install pass pins ParadeDB to the
      *currently-installed* major version, and the upgrade pass then re-runs
      install with that same pinned image. The dump would be restored into
      the same version you started on — a silent no-op upgrade.

      Re-run with the upgrade tag alone, e.g.:
          ansible-playbook ... --tags=upgrade-paradedb

      See your playbook's ParadeDB maintenance documentation for details.
  when: >-
    ansible_run_tags | intersect([
      'all',
      'setup-all', 'setup-paradedb',
      'install-all', 'install-paradedb',
    ]) | length > 0

- name: Set default paradedb_dump_dir, if not provided
  ansible.builtin.set_fact:
    paradedb_dump_dir: "/tmp"
  when: "paradedb_dump_dir | default('') == ''"

- name: Set paradedb_dump_name, if not provided
  ansible.builtin.set_fact:
    paradedb_dump_name: "{{ paradedb_identifier }}-dump.sql.zst"
  when: "paradedb_dump_name | default('') == ''"

- name: Set paradedb_auto_upgrade_backup_data_path, if not provided
  ansible.builtin.set_fact:
    paradedb_auto_upgrade_backup_data_path: "{{ paradedb_data_path }}-auto-upgrade-backup"
  when: "paradedb_auto_upgrade_backup_data_path | default('') == ''"

# No waiting is needed with the readiness check (see `paradedb_managed_databases_paradedb_start_wait_timeout_seconds`).
- name: Set paradedb_start_wait_time, if not provided
  ansible.builtin.set_fact:
    paradedb_start_wait_time: "{{ 0 if paradedb_systemd_readiness_check_enabled | bool else 15 }}"
  when: "paradedb_start_wait_time | default('') == ''"

- name: Set paradedb_force_upgrade, if not provided
  ansible.builtin.set_fact:
    paradedb_force_upgrade: false
  when: "paradedb_force_upgrade | default('') == ''"

- name: Check ParadeDB auto-upgrade backup data directory
  ansible.builtin.stat:
    path: "{{ paradedb_auto_upgrade_backup_data_path }}"
  register: result_auto_upgrade_path

- name: Abort, if existing ParadeDB auto-upgrade data path detected
  ansible.builtin.fail:
    msg: |-
      Detected that a left-over {{ paradedb_auto_upgrade_backup_data_path }} exists.
      You should rename it to {{ paradedb_data_path }} if the previous upgrade went wrong, or delete it if it went well.
  when: "result_auto_upgrade_path.stat.exists"

- name: Detect existing ParadeDB version
  ansible.builtin.import_tasks: tasks/detect_existing_paradedb_version.yml

- name: Abort, if no existing ParadeDB version detected
  ansible.builtin.fail:
    msg: "Could not find existing ParadeDB installation"
  when: "not paradedb_detected_existing | bool"

- name: Abort, if already at latest ParadeDB version
  ansible.builtin.fail:
    msg: "You are already running the latest ParadeDB version supported ({{ paradedb_container_image_latest }}). You can force an 'upgrade' anyway by passing `-e paradedb_force_upgrade=true` to the playbook."
  when: "paradedb_detected_version_number == paradedb_eligible_version_max and not paradedb_force_upgrade"

- ansible.builtin.debug:
    msg: "Upgrading the ParadeDB database from version {{ paradedb_detected_version_number }} to the maximum eligible version ({{ paradedb_eligible_version_max }})"

- name: Ensure services are stopped
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    daemon_reload: true
  with_items: "{{ paradedb_systemd_services_to_stop_for_maintenance_list }}"

- name: Ensure ParadeDB service is started
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: started
    daemon_reload: true
  register: paradedb_ensure_started_result

- name: Wait a bit, so that ParadeDB can start
  when: "paradedb_ensure_started_result.changed | bool and (paradedb_start_wait_time | int) > 0"
  ansible.builtin.wait_for:
    timeout: "{{ paradedb_start_wait_time }}"
  delegate_to: 127.0.0.1
  become: false

# We dump all databases, roles, etc.
#
# Because we'll be importing into a new container which initializes the default
# role (`paradedb_connection_username`) and database (`paradedb_db_name`) by itself on startup,
# we need to remove these from the dump, or we'll get errors saying these already exist.
- name: Perform ParadeDB database dump
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} run --rm --name {{ paradedb_identifier }}-dump
      --log-driver=none
      --user={{ paradedb_container_uid }}:{{ paradedb_container_gid }}
      --network={{ paradedb_container_network }}
      --env-file={{ paradedb_base_path }}/env-paradedb-psql
      --entrypoint={{ paradedb_container_shell_path }}
      --mount type=bind,src={{ paradedb_dump_dir }},dst=/out
      {{ paradedb_detected_version_corresponding_container_image }}
      -c "pg_dumpall -h {{ paradedb_identifier }}
      {{ '| gzip -c ' if paradedb_dump_name.endswith('.gz') else '' }}
      {{ '| zstd --stdout ' if paradedb_dump_name.endswith('.zst') else '' }}
      > /out/{{ paradedb_dump_name }}"
  register: paradedb_upgrade_paradedb_dump_command_result
  changed_when: paradedb_upgrade_paradedb_dump_command_result.rc == 0
  tags:
    - skip_ansible_lint

- name: Ensure ParadeDB is stopped
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: stopped

- name: Rename existing ParadeDB data directory
  ansible.builtin.command:
    cmd: "mv {{ paradedb_data_path }} {{ paradedb_auto_upgrade_backup_data_path }}"
  register: paradedb_upgrade_paradedb_move_command_result
  changed_when: paradedb_upgrade_paradedb_move_command_result.rc == 0

- ansible.builtin.debug:
    msg: "NOTE: Your ParadeDB data directory has been moved from `{{ paradedb_data_path }}` to `{{ paradedb_auto_upgrade_backup_data_path }}`. In the event of failure, you can stop services, move it back and run the playbook with --tags=setup-paradedb to restore operation on the old ParadeDB version ({{ paradedb_detected_version_number }})."

- name: Install ParadeDB
  ansible.builtin.import_tasks: tasks/install.yml

- name: Ensure ParadeDB autoruns and is restarted
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    enabled: true
    state: restarted
    daemon_reload: true

- name: Wait a bit, so that ParadeDB can start
  when: "(paradedb_start_wait_time | int) > 0"
  ansible.builtin.wait_for:
    timeout: "{{ paradedb_start_wait_time }}"
  delegate_to: 127.0.0.1
  become: false

# Starting the database container had automatically created the default
# role (`paradedb_connection_username`) and database (`paradedb_db_name`).
# The dump most likely contains those same entries and would try to re-create them, leading to errors.
# We need to skip over those lines.
- name: Generate ParadeDB database import command
  ansible.builtin.set_fact:
    paradedb_import_command: >-
      {{ devture_systemd_docker_base_host_command_docker }} run --rm --name {{ paradedb_identifier }}-import
      --log-driver=none
      --user={{ paradedb_container_uid }}:{{ paradedb_container_gid }}
      --cap-drop=ALL
      --network={{ paradedb_container_network }}
      --env-file={{ paradedb_base_path }}/env-paradedb-psql
      --entrypoint={{ paradedb_container_shell_path }}
      --mount type=bind,src={{ paradedb_dump_dir }},dst=/in,ro
      {{ paradedb_container_image_latest }}
      -c "cat /in/{{ paradedb_dump_name }} |
      {{ 'gunzip |' if paradedb_dump_name.endswith('.gz') else '' }}
      {{ 'unzstd |' if paradedb_dump_name.endswith('.zst') else '' }}
      {% if paradedb_import_roles_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_roles_ignore_regex }}' |
      {% endif %}
      {% if paradedb_import_databases_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_databases_ignore_regex }}' |
      {% endif %}
      {% if paradedb_import_schemas_to_ignore | length > 0 %}
      grep -vE '{{ paradedb_import_schemas_ignore_regex }}' |
      {% endif %}
      psql -v ON_ERROR_STOP=1 -h {{ paradedb_identifier }}"
  tags:
    - skip_ansible_lint

# This is a hack.
# See: https://ansibledaily.com/print-to-standard-output-without-escaping/
#
# We want to run `debug: msg=".."`, but that dumps it as JSON and escapes double quotes within it,
# which ruins the command (`paradedb_import_command`)
- name: Note about ParadeDB importing
  ansible.builtin.set_fact:
    dummy: true
  with_items:
    - >-
      Importing ParadeDB database using the following command: `{{ paradedb_import_command }}`.
      If this crashes, you can stop ParadeDB (`systemctl stop {{ paradedb_identifier }}`),
      delete the new database data (`rm -rf {{ paradedb_data_path }}`)
      and restore the automatically-made backup (`mv {{ paradedb_auto_upgrade_backup_data_path }} {{ paradedb_data_path }}`).

- name: Perform ParadeDB database import
  ansible.builtin.command:
    cmd: "{{ paradedb_import_command }}"
  register: paradedb_upgrade_paradedb_import_command_result
  changed_when: paradedb_upgrade_paradedb_import_command_result.rc == 0

- name: Delete ParadeDB database dump file
  ansible.builtin.file:
    path: "{{ paradedb_dump_dir }}/{{ paradedb_dump_name }}"
    state: absent

- name: Ensure ParadeDB is stopped (if it previously was)
  when: "paradedb_ensure_started_result.changed | bool"
  ansible.builtin.service:
    name: "{{ paradedb_identifier }}"
    state: stopped

- name: Ensure services are started
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  with_items: "{{ paradedb_systemd_services_to_stop_for_maintenance_list }}"

- ansible.builtin.debug:
    msg: "NOTE: Your old ParadeDB data directory is preserved at `{{ paradedb_auto_upgrade_backup_data_path }}`. You might want to get rid of it once you've confirmed that all is well."
