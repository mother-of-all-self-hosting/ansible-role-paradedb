---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "paradedb_paradedb_process_extra_arguments_default", "new": "paradedb_process_extra_arguments_default" }
    - { "old": "paradedb_paradedb_process_extra_arguments_unix_socket", "new": "paradedb_process_extra_arguments_unix_socket" }
    - { "old": "paradedb_paradedb_process_extra_arguments_auto", "new": "paradedb_process_extra_arguments_auto" }
    - { "old": "paradedb_paradedb_process_extra_arguments_custom", "new": "paradedb_process_extra_arguments_custom" }
    - { "old": "paradedb_vacuum_database", "new": "<superseded by paradedb_vacuum_default_databases_list>" }
    - { "old": "paradedb_additional_databases", "new": "paradedb_managed_databases" }
    - { "old": "paradedb_vacuum_command", "new": "<superseded by paradedb_vacuum_presets and paradedb_vacuum_preset, or paradedb_vacuum_query>" }
    - { "old": "docker_paradedb_container_image_registry_prefix", "new": "paradedb_container_image_registry_prefix" }
    - { "old": "paradedb_pgloader_container_image_name_prefix", "new": "paradedb_pgloader_container_image_registry_prefix" }
    - { "old": "paradedb_pgloader_docker_image", "new": "paradedb_pgloader_container_image" }
    - { "old": "paradedb_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }
    - { "old": "paradedb_pgloader_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required ParadeDB settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - paradedb_identifier
    - paradedb_uid
    - paradedb_gid
    - paradedb_container_network
    - paradedb_connection_hostname
    - paradedb_connection_port
    - paradedb_connection_username
    - paradedb_connection_password
    - paradedb_db_name
    - paradedb_architecture

- name: Fail if ParadeDB password length exceeded
  ansible.builtin.fail:
    msg: "The maximum `paradedb_connection_password` length is 99 characters"
  when: "paradedb_connection_password | length > 99"
